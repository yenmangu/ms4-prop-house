<template id="stripe-form-template">
  <form id="payment-form" class="p-2">
    <div id="link-authentication-element"></div>
    <div id="payment-element"></div>
    <div id="payment-message" class="mt-3 text-danger d-none" role="alert"></div>
    <button id="submit-payment"
            class="btn btn-success w-100 mt-4 py-2 position-relative">
      <span id="button-text">Complete Purchase</span>
      <div id="spinner"
           class="spinner-border spinner-border-sm d-none"
           role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </button>
  </form>
</template>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast"
       class="toast"
       role="alert"
       aria-live="assertive"
       aria-atomic="true">
    <div class="toast-header bg-dark text-white">
      <strong id="toastTitle" class="me-auto">Secure Checkout</strong>
      <button type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="toast"
              aria-label="Close"></button>
    </div>
    <div id="toastBody" class="toast-body"></div>
  </div>
</div>
