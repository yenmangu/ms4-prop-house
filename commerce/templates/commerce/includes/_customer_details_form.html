<form id="create-intent"
      hx-post="{% url 'commerce:create_payment_intent' %}"
      hx-swap="none"
      class="industrial-form">
  {% if user.is_authenticated %}
    {{ user.get_full_name|default:user.username|json_script:"user-name-data" }}
    {{ user.email|json_script:"user-email-data" }}
  {% endif %}
  <div class="form-section sliding-panel">
    <header class="section-header">
      <h2 class="industrial-title">Contact Information</h2>
    </header>
    {% if user.is_authenticated %}
      <div class="industrial-checkbox-wrapper">
        <input type="checkbox"
               name="use_account_details"
               id="use_account_details"
               checked>
        <label for="use_account_details" class="industrial-label-inline">Use existing account details</label>
      </div>
    {% endif %}
    <div class="field-group">
      <div class="industrial-input-wrapper">
        <label for="id_full_name" class="industrial-label">Full Name</label>
        <input type="text"
               id="id_full_name"
               name="name"
               class="industrial-input"
               placeholder="e.g. John Doe"
               form="create-intent"
               {% if user.is_authenticated %}value="{{ user.get_full_name|default:user.username }}" readonly{% endif %}
               required>
      </div>
      <div class="industrial-input-wrapper">
        <label for="id_email" class="industrial-label">Email Address</label>
        <input type="email"
               id="id_email"
               name="email"
               class="industrial-input"
               placeholder="email@example.com"
               form="create-intent"
               {% if user.is_authenticated %}value="{{ user.email }}" readonly{% endif %}
               required>
      </div>
    </div>
  </div>
  <div class="form-section sliding-panel">
    <header class="section-header">
      <h2 class="industrial-title">Payment Method</h2>
    </header>
    <div id="payment-element" class="stripe-container"></div>
  </div>
  <div class="form-actions">
    <button type="submit"
            form="create-intent"
            id="submit-button"
            class="btn--industrial"
            hx-indicator="#loading-spinner">
      <span class="btn-text">Proceed to payment</span>
      <span id="loading-spinner"
            class="htmx-indicator spinner-border spinner-border-sm"></span>
    </button>
  </div>
</form>
