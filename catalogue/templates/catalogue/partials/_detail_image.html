{% load static %}
{% load cloudinary %}
{% with image=product.featured_image %}
        {% if image.public_id == "placeholder" %}
                <picture>
                        <source type="image/avif"
                                srcset="{% static 'images/default-768.avif' %} 768w,
                                        {% static 'images/default-1200.avif' %} 1200w,
                                        {% static 'images/default-1600.avif' %} 1600w"
                                sizes="(max-width: 768px) 100vw,
                                       (max-width: 1200px) 80vw,
                                       1200px">
                        <source type="image/webp"
                                srcset="{% static 'images/default-768.webp' %} 768w,
                                        {% static 'images/default-1200.webp' %} 1200w,
                                        {% static 'images/default-1600.webp' %} 1600w"
                                sizes="(max-width: 768px) 100vw,
                                       (max-width: 1200px) 80vw,
                                       1200px">
                        <img src="{% static 'images/default-1200.jpg' %}"
                             alt="{{ product.name }}"
                             class="img-fluid product-detail__image"
                             width="1200"
                             height="800"
                             loading="eager"
                             fetchpriority="high"
                             decoding="async">
                </picture>
        {% else %}
                <img src="{% cloudinary_url image width=1200 height=800 crop='fill' gravity='auto' fetch_format='auto' quality='auto' %}"
                     srcset="{% cloudinary_url width=420 height=200 crop='fill' gravity='auto' fetch_format='auto' quality='auto' %} 420w,
                             {% cloudinary_url image width=768 height=512 crop='fill' gravity='auto' fetch_format='auto' quality='auto' %} 768w,
                             {% cloudinary_url image width=1200 height=800 crop='fill' gravity='auto' fetch_format='auto' quality='auto' %} 1200w,
                             {% cloudinary_url image width=1600 height=1067 crop='fill' gravity='auto' fetch_format='auto' quality='auto' %} 1600w"
                     sizes="(max-width: 768px) 100vw,
                            (max-width: 1200px) 80vw,
                            1200px"
                     alt="{{ product.name }}"
                     class="img-fluid product-detail__image"
                     width="1200"
                     height="800"
                     loading="eager"
                     fetchpriority="high"
                     decoding="async">
        {% endif %}
{% endwith %}
